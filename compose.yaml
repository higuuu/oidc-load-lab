name: oidc-load-lab
services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run python3 scripts/lab.py init}
    command: ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=256MB"]
    volumes:
      - db-data:/var/lib/postgresql/data
    mem_limit: 2g
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 30
  keycloak:
    build:
      context: .
      dockerfile: Containerfile
    image: oidc-load-lab-keycloak:26.7.3
    command: ["start", "--optimized", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: lab
      KC_DB_PASSWORD: ${DB_PASSWORD:?Run init}
      KC_DB_POOL_INITIAL_SIZE: 10
      KC_DB_POOL_MIN_SIZE: 10
      KC_DB_POOL_MAX_SIZE: 20
      KC_BOOTSTRAP_ADMIN_USERNAME: lab-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run init}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://keycloak:8080
      KC_HTTP_ACCESS_LOG_ENABLED: "false"
      JAVA_OPTS_KC_HEAP: -Xms1g -Xmx2g
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:19000:9000"
    volumes:
      - ./.runtime/import:/opt/keycloak/data/import:ro
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 3g
    cpus: 2
  k6:
    image: grafana/k6:1.8.1
    profiles: [load]
    environment:
      K6_NO_USAGE_REPORT: "true"
      LAB_PASSWORD: ${LAB_PASSWORD:?Run init}
    volumes:
      - ./load:/scripts:ro
      - ./results:/results
    working_dir: /scripts
    mem_limit: 2g
    cpus: 1
    # Local-only synthetic lab. No cloud output or host credential mounts.
volumes:
  db-data:
